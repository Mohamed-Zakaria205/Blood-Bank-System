
  <!DOCTYPE html>
  <html lang="ar" dir="rtl">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="description" content="نظام إدارة بنك الدم — محافظة بني سويف" />
      <title>BloodLink — نظام إدارة بنك الدم</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <!-- Flash prevention: apply theme class BEFORE first paint -->
      <script>
        (function () {
          try {
            var stored = localStorage.getItem('bloodlink-theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = stored === 'dark' || (!stored && prefersDark);
            if (isDark) document.documentElement.classList.add('dark');
          } catch (_) {}
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
